name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python still receiving security fixes. 3.9 and 3.10 are past, or
        # about to pass, end of life.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The tool and its tests use only the standard library, so there is
      # nothing to install.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose
